<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tareas</title>
<style>
:root{
  --bg:#f3f2ee;--panel:#fff;--text:#1b1b1a;--muted:#6b6a66;--line:#e2e0d9;--hover:#f0eee8;
  --urgent-bg:#fff7f5;--claim-bg:#faf6f1;--wait-bg:#f1eae1;--wait-line:#dccbb8;
  --dot-do:#1b1b1a;--amber:#a0620f;--red:#c2321e;--me-bg:#1b1b1a;--me-fg:#fff;--accent:#1f4e8c;--shadow:0 6px 24px rgba(0,0,0,.18);
}
:root[data-theme=dark]{
  --bg:#1a1a19;--panel:#242423;--text:#ececea;--muted:#9a9893;--line:#3a3a37;--hover:#2f2f2d;
  --urgent-bg:#3a2420;--claim-bg:#2e2a23;--wait-bg:#2d2822;--wait-line:#4a3f33;
  --dot-do:#e8e8e6;--amber:#e0953a;--red:#ee6a55;--me-bg:#ececea;--me-fg:#1b1b1a;--accent:#8db4ea;--shadow:0 6px 24px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 20px 6px}
header h1{font-size:20px;margin:0}
.date-now{color:var(--muted)}.date-now::first-letter{text-transform:uppercase}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 12px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
#filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:13px}
.fchip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.fchip.sub{font-size:12px;padding:2px 10px;border-style:dashed}
.fsep{width:1px;height:18px;background:var(--line);margin:0 4px}
#search{width:170px}
.quick{padding:6px 20px 8px}
#q{width:100%;height:46px;font-size:16px;padding:0 14px;border-radius:10px;border:1px solid var(--line)}
#q:focus{border-color:var(--text);outline:none}
.help{color:var(--muted);font-size:12px;margin-top:5px}
.help b{color:var(--text);font-weight:600}
main{flex:1;min-height:0;display:grid;grid-template-columns:35% 1fr;gap:14px;padding:6px 20px 10px}
.today{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0}
.rest{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;min-height:0}
.colhead{display:flex;align-items:baseline;gap:8px;padding:10px 12px 6px;font-weight:600}
.today .colhead{font-size:17px;padding:14px 16px 8px}
.count{color:var(--muted);font-weight:500;font-size:13px}
.count.warn{color:var(--red);font-weight:600}
.list{flex:1;overflow:auto;padding:4px 10px 10px;min-height:0}
.today .list{padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px}
.col{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0}
:root[data-theme=dark] .col{background:rgba(255,255,255,.04)}
.col.waiting{background:var(--wait-bg);border-color:var(--wait-line)}
.col.waiting .colhead{color:var(--amber)}
.col .colhead{font-size:13px}
.over{outline:2px dashed var(--accent);outline-offset:-3px}
.empty{color:var(--muted);font-size:12px;padding:8px 4px}
/* tarjetas Hoy */
.card{position:relative;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.card.urgente{background:var(--urgent-bg)}
.card.claim{background:var(--claim-bg)}
.card.sel,.row.sel{box-shadow:0 0 0 2px var(--accent)}
.c-top{display:flex;gap:10px;align-items:flex-start}
.c-top .title{font-size:16px;flex:1;word-break:break-word;cursor:text}
.urgente .title{font-weight:600}
.c-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 0 22px}
.c-btns{display:flex;gap:6px;margin:10px 0 0 22px}
.c-btns button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 10px;font-size:13px}
.c-btns button:hover{background:var(--hover)}
.c-btns .ok{margin-left:auto}
.claimtxt{color:var(--amber);font-size:12px;font-weight:600}
.dot{flex:none;border:0;padding:0;border-radius:50%;background:var(--dot-do);width:12px;height:12px;margin-top:5px;position:relative}
.dot::after{content:"";position:absolute;inset:-6px}
.dot.reclamar{background:var(--amber)}.dot.urgente{background:var(--red)}
.s9 .dot,.dot.s9{width:9px;height:9px;margin-top:5px}
.chip{border:0;border-radius:999px;padding:1px 9px;font-size:12px;line-height:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.me{background:var(--me-bg);color:var(--me-fg)}
.chip.proj{background:transparent;border:1px solid var(--line);color:var(--muted)}
.dtxt{background:none;border:0;padding:0 2px;color:var(--muted);font-size:12px;border-radius:4px}
.dtxt:hover{background:var(--hover)}
.dtxt.late{color:var(--red);font-weight:600}
/* filas compactas */
.row{position:relative;border-radius:8px;padding:5px 6px;cursor:default}
.row:hover{background:var(--hover)}
.row .r1{display:flex;gap:7px;align-items:flex-start}
.row .title{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
.row.urgente .title{font-weight:600}
.row.urgente{background:var(--urgent-bg)}
.row .r2{display:flex;gap:6px;align-items:center;margin:2px 0 0 16px;min-width:0}
.hb{display:none;position:absolute;right:3px;top:3px;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:1px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.row:hover .hb,.row.sel .hb{display:flex}
.hb button{border:0;background:none;border-radius:5px;padding:1px 6px;font-size:12px}
.hb button:hover{background:var(--hover)}
.inline-edit{width:100%;font-size:inherit;padding:2px 6px}
.dragging{opacity:.4}
.mark-before{box-shadow:0 -3px 0 var(--accent)}.mark-after{box-shadow:0 3px 0 var(--accent)}
footer{display:flex;gap:16px;align-items:center;padding:6px 20px 10px;color:var(--muted);font-size:12px}
footer .lg{display:inline-flex;align-items:center;gap:5px;margin-right:6px}
footer .lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:12px}
/* overlays */
#pop{position:fixed;display:none;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:150px;max-height:60vh;overflow:auto}
#pop button.it{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:5px 8px;border-radius:6px}
#pop button.it:hover{background:var(--hover)}
#pop .gh{font-size:11px;color:var(--muted);padding:6px 8px 2px;text-transform:uppercase}
#pop .qd{display:flex;gap:4px;margin-bottom:6px}
#pop .qd button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 6px}
#ac{position:fixed;display:none;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:220px;max-height:260px;overflow:auto}
#ac button{display:flex;width:100%;gap:8px;border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;align-items:center}
#ac button.on{background:var(--hover)}
#ac .gh{font-size:11px;color:var(--muted);padding:4px 10px}
#ac .new{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;display:none;z-index:90;font-size:13px}
#panel{position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:40;display:none;flex-direction:column;padding:16px;gap:10px;overflow:auto}
#panel label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
#panel label.ck{flex-direction:row;align-items:center;gap:8px}
#panel input,#panel select,#panel textarea{color:var(--text);font-size:14px}
#panel textarea{min-height:140px;resize:vertical}
#modalbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:none;align-items:flex-start;justify-content:center;padding:5vh 16px}
#modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(720px,100%);max-height:90vh;overflow:auto;padding:20px 24px}
#modal h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center}
#modal h3{margin:20px 0 8px;font-size:13px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.frow{display:flex;gap:8px;align-items:center;margin:5px 0;flex-wrap:wrap}
.frow label{min-width:170px}
.frow.sub{margin-left:26px}
.frow input[type=text]{flex:1;min-width:120px}
.grp{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
table.keys{border-collapse:collapse;width:100%}
table.keys td{padding:4px 8px;border-bottom:1px solid var(--line)}
kbd{background:var(--hover);border:1px solid var(--line);border-radius:4px;padding:0 6px;font:12px ui-monospace,monospace}
.donerow{display:flex;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.donerow span.d{color:var(--muted);font-size:12px;width:110px}
.donerow span.t{flex:1}
</style>
</head>
<body>
<header>
  <h1>Tareas</h1><span class="date-now" id="dnow"></span>
  <span class="sp"></span>
  <div id="filters"></div>
  <input id="search" type="search" placeholder="Buscar ( / )" aria-label="Buscar">
  <button class="btn" id="btnDone">Hechas (0)</button>
  <button class="btn" id="btnSet">Ajustes</button>
</header>
<div class="quick">
  <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Nueva tarea…  ej: Pedir presupuesto @Marta #Norte vie !" aria-label="Línea rápida">
  <div class="help"><b>@</b>persona · <b>#</b>proyecto · <b>hoy mañ lun…dom 12/10 +3 nov</b> fecha · <b>!</b> urgente · <b>?</b> reclamar &nbsp;|&nbsp; <kbd>N</kbd> nueva · <kbd>/</kbd> buscar · <kbd>?</kbd> atajos · con fila seleccionada: <kbd>H</kbd> <kbd>M</kbd> <kbd>S</kbd> <kbd>P</kbd> <kbd>L</kbd> <kbd>E</kbd> <kbd>X</kbd></div>
</div>
<main id="board"></main>
<footer id="foot"></footer>
<aside id="panel" aria-label="Detalle de tarea"></aside>
<div id="modalbg"><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="pop"></div>
<div id="ac"></div>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ======================= ESTADO ======================= */
const KEY = 'tareas.v1';
const PAL = {
  blue:['#dbe8f7','#1f4e8c'], green:['#d9efe8','#1b6b54'], violet:['#ece0f5','#5e3a8c'], orange:['#fbe4d0','#8a4a0f'],
  teal:['#d4eef0','#0f6a70'], pink:['#f8dde6','#8c2f52'], olive:['#e8ecd2','#5a6414'], slate:['#e2e5ea','#3b4756']
};
const PAL_NAMES = Object.keys(PAL);
const COLS = [
  {k:'today',n:'Hoy'},{k:'tomorrow',n:'Mañana'},{k:'week',n:'Esta semana'},
  {k:'next',n:'Próxima semana'},{k:'later',n:'Más adelante'},{k:'waiting',n:'Esperando'}
];
const COLNAME = Object.fromEntries(COLS.map(c => [c.k, c.n]));
const TYPES = ['hacer','reclamar','urgente'];
let S;
const UI = { filter:{kind:'all',programId:null,projectId:null,q:''}, sel:null, order:[], drag:null, panel:null, modal:null, file:{state:'none',name:'',time:''} };

const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

function defaults(){
  return { v:1,
    settings:{captureIn:'week',waitDays:5,warnToday:5,theme:'light'},
    programs:[{id:'p1',name:'General'}], projects:[],
    people:[{id:'me',name:'Yo',color:'black'}], tasks:[] };
}
function normalize(d){
  if(!d || typeof d !== 'object' || !Array.isArray(d.tasks)) return null;
  const x = defaults();
  x.settings = Object.assign(x.settings, d.settings || {});
  x.programs = Array.isArray(d.programs) ? d.programs : x.programs;
  x.projects = Array.isArray(d.projects) ? d.projects : [];
  x.people = Array.isArray(d.people) ? d.people : [];
  if(!x.people.some(p => p.id === 'me')) x.people.unshift({id:'me',name:'Yo',color:'black'});
  x.people.find(p => p.id === 'me').color = 'black';
  if(!x.programs.length) x.programs.push({id:'p1',name:'General'});
  x.tasks = d.tasks.map((t,i) => Object.assign({
    id:uid('t'),title:'',personId:'me',projectId:null,type:'hacer',date:today(),waiting:false,remindOn:null,
    note:'',order:i,done:false,doneAt:null,createdAt:new Date().toISOString()}, t));
  return x;
}

/* ======================= FECHAS ======================= */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => iso(new Date());
const addDays = (s,n) => { const d = fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const dow = s => (fromIso(s).getDay()+6)%7;            // 0 = lunes
const sunday = s => addDays(s, 6-dow(s));
const friday = s => { const d = dow(s); return d >= 4 ? addDays(s,11-d) : addDays(s,4-d); };
const nextMonday = s => addDays(s, 7-dow(s));
const diffDays = (a,b) => Math.round((fromIso(a)-fromIso(b))/864e5);
const DAYN = ['lun','mar','mié','jue','vie','sáb','dom'];
const MONN = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const dm = s => { const [,m,d] = s.split('-'); return `${d}/${m}`; };
function fmtDate(s){
  if(!s) return '';
  const td = today(), n = diffDays(s,td);
  if(n === 0) return 'hoy';
  if(n === 1) return 'mañ';
  if(n > 1 && n <= 13) return `${DAYN[dow(s)]} ${+s.slice(8)}`;
  if(n > 13 && s.endsWith('-01')) return MONN[+s.slice(5,7)-1];
  return s.slice(0,4) === td.slice(0,4) ? dm(s) : `${dm(s)}/${s.slice(2,4)}`;
}
const fmtLong = () => new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).replace(/ De /g,' de ');
const hhmm = () => new Date().toTimeString().slice(0,5);

/* ======================= PARSER ======================= */
const WD = {lun:0,lunes:0,mar:1,martes:1,mie:2,miercoles:2,jue:3,jueves:3,vie:4,viernes:4,sab:5,sabado:5,dom:6,domingo:6};
const MN = {ene:0,enero:0,feb:1,febrero:1,marzo:2,abr:3,abril:3,may:4,mayo:4,jun:5,junio:5,jul:6,julio:6,ago:7,agosto:7,
  sep:8,sept:8,set:8,septiembre:8,setiembre:8,oct:9,octubre:9,nov:10,noviembre:10,dic:11,diciembre:11};
function parseDateToken(w, td){
  const n = norm(w);
  if(n === 'hoy') return td;
  if(n === 'man' || n === 'mana' || n === 'manana') return addDays(td,1);
  if(n in WD) return addDays(td, (WD[n]-dow(td)+7)%7);
  let m;
  if((m = /^\+(\d{1,3})$/.exec(n))) return addDays(td,+m[1]);
  if((m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?$/.exec(n))){
    const dd = +m[1], mm = +m[2]; let y = m[3] ? (m[3].length === 2 ? 2000+ +m[3] : +m[3]) : +td.slice(0,4);
    const dt = new Date(y,mm-1,dd);
    if(dt.getMonth() !== mm-1 || dt.getDate() !== dd) return null;
    let r = iso(dt);
    if(!m[3] && r < td){ dt.setFullYear(y+1); r = iso(dt); }
    return r;
  }
  if(n in MN){
    const y = +td.slice(0,4); let r = `${y}-${pad(MN[n]+1)}-01`;
    if(r <= td) r = `${y+1}-${pad(MN[n]+1)}-01`;
    return r;
  }
  return null;
}
function parseLine(text){
  const out = {title:''}, words = [], td = today();
  for(const w of text.trim().split(/\s+/)){
    if(!w) continue;
    if(w === '!'){ out.type = 'urgente'; continue; }
    if(w === '?'){ out.type = 'reclamar'; continue; }
    if(w.length > 1 && w[0] === '@'){ out.person = w.slice(1); continue; }
    if(w.length > 1 && w[0] === '#'){ out.project = w.slice(1); continue; }
    const d = parseDateToken(w, td);
    if(d){ out.date = d; continue; }
    words.push(w);
  }
  out.title = words.join(' ');
  return out;
}
function findByName(list, token){
  const n = norm(token.replace(/_/g,' '));
  const ex = list.find(x => norm(x.name) === n);
  if(ex) return ex;
  const pre = list.filter(x => norm(x.name).startsWith(n));
  return pre.length === 1 ? pre[0] : null;
}
function resolve(p){
  const patch = {}, bad = [];
  if(p.person != null){ const x = findByName(S.people,p.person); x ? patch.personId = x.id : bad.push('@'+p.person); }
  if(p.project != null){ const x = findByName(S.projects,p.project); x ? patch.projectId = x.id : bad.push('#'+p.project); }
  if(p.type) patch.type = p.type;
  if(p.date){ patch.date = p.date; patch.waiting = false; patch.remindOn = null; }
  return {patch, bad};
}
function defaultDate(){
  const td = today();
  switch(S.settings.captureIn){
    case 'today': return td;
    case 'tomorrow': return addDays(td,1);
    case 'nextweek': return nextMonday(td);
    default: return friday(td);
  }
}

/* ======================= COLUMNAS ======================= */
function remindOf(t){ return t.remindOn || addDays(today(), S.settings.waitDays); }
function colOf(t, td){
  if(t.waiting) return remindOf(t) <= td ? 'today' : 'waiting';
  if(t.date <= td) return 'today';
  if(t.date === addDays(td,1)) return 'tomorrow';
  const sun = sunday(td);
  if(t.date <= sun) return 'week';
  if(t.date <= addDays(sun,7)) return 'next';
  return 'later';
}
const isClaim = (t, td) => t.waiting && remindOf(t) <= td;
function passes(t){
  const f = UI.filter;
  if(f.kind === 'mine' && t.personId !== 'me') return false;
  if(f.kind === 'claim' && !(t.type === 'reclamar' || t.waiting)) return false;
  if(f.programId || f.projectId){
    const pr = S.projects.find(p => p.id === t.projectId);
    if(!pr) return false;
    if(f.programId && pr.programId !== f.programId) return false;
    if(f.projectId && pr.id !== f.projectId) return false;
  }
  if(f.q && !norm(t.title + ' ' + (t.note || '')).includes(norm(f.q))) return false;
  return true;
}
const person = id => S.people.find(p => p.id === id) || S.people[0];
const project = id => S.projects.find(p => p.id === id);
const taskById = id => S.tasks.find(t => t.id === id);
const maxOrder = () => S.tasks.reduce((m,t) => Math.max(m,t.order||0), 0);

/* ======================= RENDER ======================= */
function personChip(t, act){
  const p = person(t.personId);
  const st = p.color === 'black' ? '' : ` style="background:${(PAL[p.color]||PAL.slate)[0]};color:${(PAL[p.color]||PAL.slate)[1]}"`;
  return `<button class="chip${p.color === 'black' ? ' me' : ''}" data-act="person"${st} aria-label="Persona: ${esc(p.name)}">${esc(p.name)}</button>`;
}
function dotHtml(t, td, s9){
  const ty = (isClaim(t,td) && t.type === 'hacer') ? 'reclamar' : t.type;
  return `<button class="dot ${ty}${s9 ? ' s9' : ''}" data-act="rot" aria-label="Tipo: ${t.type}. Cambiar"></button>`;
}
function cardHtml(t, td){
  const claim = isClaim(t,td), pr = project(t.projectId);
  const late = !t.waiting && t.date < td;
  return `<div class="card ${t.type}${claim ? ' claim' : ''}${UI.sel === t.id ? ' sel' : ''}" draggable="true" data-id="${t.id}">
    <div class="c-top">${dotHtml(t,td)}<span class="title" data-act="edit" title="Clic para editar">${esc(t.title)}</span></div>
    <div class="c-meta">${personChip(t)}
      ${pr ? `<button class="chip proj" data-act="proj">#${esc(pr.name)}</button>` : `<button class="chip proj" data-act="proj" aria-label="Asignar proyecto">#</button>`}
      ${claim ? `<span class="claimtxt">reclamar · desde ${dm(remindOf(t))}</span>` : ''}
      <button class="dtxt${late ? ' late' : ''}" data-act="date">${fmtDate(t.date)}</button></div>
    <div class="c-btns"><button data-act="tmr">→ mañ</button><button data-act="fri">→ vie</button><button data-act="wait">⏸ espera</button><button class="ok" data-act="done" aria-label="Hecha">✓</button></div>
  </div>`;
}
function rowHtml(t, td, col){
  const late = !t.waiting && t.date < td;
  const dtxt = col === 'waiting' ? `reclamar ${fmtDate(remindOf(t))}` : fmtDate(t.date);
  return `<div class="row ${t.type}${UI.sel === t.id ? ' sel' : ''}" draggable="true" data-id="${t.id}">
    <div class="r1">${dotHtml(t,td,true)}<span class="title" data-act="edit" title="${esc(t.title)}">${esc(t.title)}</span></div>
    <div class="r2">${personChip(t)}<button class="dtxt${late ? ' late' : ''}" data-act="date">${dtxt}</button></div>
    <div class="hb"><button data-act="sun" aria-label="A Hoy">☀</button>${col === 'tomorrow' ? '' : '<button data-act="tmr">→ mañ</button>'}<button data-act="wait" aria-label="Esperar">⏸</button><button data-act="done" aria-label="Hecha">✓</button></div>
  </div>`;
}
function renderFilters(){
  const f = UI.filter, all = f.kind === 'all' && !f.programId;
  let h = `<button class="fchip${all ? ' on' : ''}" data-f="all">Todo</button>
    <button class="fchip${f.kind === 'mine' ? ' on' : ''}" data-f="mine">Mías</button>
    <button class="fchip${f.kind === 'claim' ? ' on' : ''}" data-f="claim">Reclamar</button>`;
  if(S.programs.length) h += '<span class="fsep"></span>';
  h += S.programs.map(p => `<button class="fchip${f.programId === p.id ? ' on' : ''}" data-f="prg" data-id="${p.id}">${esc(p.name)}</button>`).join('');
  if(f.programId){
    const prs = S.projects.filter(p => p.programId === f.programId).sort((a,b) => (b.fav?1:0)-(a.fav?1:0));
    h += '<span class="fsep"></span>' + prs.map(p => `<button class="fchip sub${f.projectId === p.id ? ' on' : ''}" data-f="prj" data-id="${p.id}">${p.fav ? '★ ' : ''}${esc(p.name)}</button>`).join('');
  }
  document.getElementById('filters').innerHTML = h;
}
function renderFoot(){
  const f = UI.file;
  let st;
  if(f.state === 'ok') st = `Guardado en ${esc(f.name)} · ${f.time}`;
  else if(f.state === 'perm') st = `Archivo vinculado (${esc(f.name)}) · <button class="linkbtn" data-act="perm">dar permiso</button>`;
  else if(f.state === 'err') st = `<span style="color:var(--red)">Error con ${esc(f.name)}</span> · <button class="linkbtn" data-act="perm">reintentar</button>`;
  else st = 'Solo navegador · vincular archivo en Ajustes';
  document.getElementById('foot').innerHTML =
    `<span><span class="lg"><i style="background:var(--dot-do)"></i>hacer</span><span class="lg"><i style="background:var(--amber)"></i>reclamar</span><span class="lg"><i style="background:var(--red)"></i>urgente</span><span class="lg">· chip de color = persona</span></span><span class="sp"></span><span>${st}</span>`;
}
function render(){
  closePop();
  const td = today();
  document.getElementById('dnow').textContent = fmtLong();
  const cols = Object.fromEntries(COLS.map(c => [c.k, []]));
  S.tasks.forEach(t => { if(!t.done && passes(t)) cols[colOf(t,td)].push(t); });
  cols.today.sort((a,b) => (a.order||0)-(b.order||0));
  ['tomorrow','week','next','later'].forEach(k => cols[k].sort((a,b) => a.date.localeCompare(b.date) || (a.order||0)-(b.order||0)));
  cols.waiting.sort((a,b) => remindOf(a).localeCompare(remindOf(b)));
  UI.order = COLS.flatMap(c => cols[c.k].map(t => t.id));
  if(UI.sel && !UI.order.includes(UI.sel)) UI.sel = null;
  const n = cols.today.length, warn = n > S.settings.warnToday;
  const todayHtml = `<section class="today" data-drop="today">
    <div class="colhead">Hoy <span class="count${warn ? ' warn' : ''}">${n}${warn ? ' · demasiadas, reparte' : ''}</span></div>
    <div class="list">${n ? cols.today.map(t => cardHtml(t,td)).join('') : '<div class="empty">Nada para hoy.</div>'}</div></section>`;
  const rest = COLS.slice(1).map(c => `<section class="col${c.k === 'waiting' ? ' waiting' : ''}" data-drop="${c.k}">
    <div class="colhead">${c.n} <span class="count">${cols[c.k].length}</span></div>
    <div class="list">${cols[c.k].length ? cols[c.k].map(t => rowHtml(t,td,c.k)).join('') : '<div class="empty">—</div>'}</div></section>`).join('');
  document.getElementById('board').innerHTML = todayHtml + `<div class="rest">${rest}</div>`;
  renderFilters();
  renderFoot();
  document.getElementById('btnDone').textContent = `Hechas (${S.tasks.filter(t => t.done).length})`;
  document.documentElement.dataset.theme = S.settings.theme === 'dark' ? 'dark' : 'light';
  if(UI.panel){ const t = taskById(UI.panel); if(!t || t.done) closePanel(); }
  const el = UI.sel && document.querySelector(`[data-id="${UI.sel}"]`);
  if(el) el.scrollIntoView({block:'nearest'});
}

/* ======================= PERSISTENCIA ======================= */
let fh = null, saveTimer = null;
const hasFS = () => 'showSaveFilePicker' in window && 'showOpenFilePicker' in window;
function idb(){
  return new Promise((res,rej) => { const r = indexedDB.open('tareas',1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function idbGet(k){ const db = await idb(); return new Promise((res,rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k,v){ const db = await idb(); return new Promise((res,rej) => { const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbDel(k){ const db = await idb(); return new Promise((res,rej) => { const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
function lsSave(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){
  lsSave();
  if(fh){ clearTimeout(saveTimer); saveTimer = setTimeout(writeFile, 500); }
}
async function writeFile(){
  if(!fh) return;
  try{
    const w = await fh.createWritable();
    await w.write(JSON.stringify(S,null,2)); await w.close();
    UI.file = {state:'ok',name:fh.name,time:hhmm()};
  }catch(e){ UI.file = {state:'err',name:fh.name,time:''}; }
  renderFoot();
}
async function readFile(){
  try{
    const txt = await (await fh.getFile()).text();
    if(txt.trim()){
      const d = normalize(JSON.parse(txt));
      if(!d) throw new Error('formato');
      S = d; lsSave();
      UI.file = {state:'ok',name:fh.name,time:hhmm()};
    }else await writeFile();
  }catch(e){ UI.file = {state:'err',name:fh.name,time:''}; }
  render();
}
async function askPerm(){
  if(!fh) return;
  try{ if(await fh.requestPermission({mode:'readwrite'}) === 'granted') await readFile(); }catch(e){}
}
async function linkFile(mode){
  try{
    const opts = {types:[{description:'JSON',accept:{'application/json':['.json']}}]};
    if(mode === 'open') fh = (await window.showOpenFilePicker(opts))[0];
    else fh = await window.showSaveFilePicker(Object.assign({suggestedName:'tareas.json'},opts));
    await idbSet('handle', fh);
    if(mode === 'open') await readFile(); else await writeFile();
    render(); openSettings();
  }catch(e){ /* cancelado */ }
}
async function unlinkFile(){ fh = null; try{ await idbDel('handle'); }catch(e){} UI.file = {state:'none',name:'',time:''}; renderFoot(); openSettings(); }
async function init(){
  let d = null;
  try{ d = normalize(JSON.parse(localStorage.getItem(KEY))); }catch(e){}
  S = d || defaults();
  render();
  if(hasFS()){
    try{
      fh = await idbGet('handle') || null;
      if(fh){
        UI.file = {state:'perm',name:fh.name,time:''};
        if(await fh.queryPermission({mode:'readwrite'}) === 'granted') await readFile(); else renderFoot();
      }
    }catch(e){ fh = null; }
  }
}
function exportJson(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download = 'tareas.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importJson(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = normalize(JSON.parse(r.result));
      if(!d) throw new Error();
      if(!confirm('Esto reemplaza todos los datos actuales. ¿Continuar?')) return;
      S = d; commit(); openSettings(); toast('Importado');
    }catch(e){ toast('Archivo no válido'); }
  };
  r.readAsText(file);
}
function commit(){ save(); render(); }

/* ======================= ACCIONES ======================= */
function toast(msg){
  const el = document.getElementById('toast'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2200);
}
function moveTo(id, col){
  const t = taskById(id), td = today(); if(!t) return;
  const p = {waiting:false, remindOn:null};
  switch(col){
    case 'today': p.date = td; break;
    case 'tomorrow': p.date = addDays(td,1); break;
    case 'week': p.date = friday(td); break;
    case 'next': p.date = nextMonday(td); break;
    case 'later': p.date = addDays(td,30); break;
    case 'waiting': p.waiting = true; p.remindOn = addDays(td, S.settings.waitDays); break;
  }
  Object.assign(t, p);
}
function setDone(id, v){
  const t = taskById(id); if(!t) return;
  t.done = v; t.doneAt = v ? new Date().toISOString() : null;
}
function neighbor(id){ const i = UI.order.indexOf(id); return UI.order[i+1] || UI.order[i-1] || null; }
function doDone(id){ const nb = neighbor(id); setDone(id,true); UI.sel = nb; commit(); }
function reorderToday(id, beforeId){
  const td = today();
  const list = S.tasks.filter(t => !t.done && colOf(t,td) === 'today' && t.id !== id).sort((a,b) => (a.order||0)-(b.order||0));
  const t = taskById(id);
  let i = beforeId ? list.findIndex(x => x.id === beforeId) : -1;
  if(i < 0) i = list.length;
  list.splice(i,0,t);
  list.forEach((x,k) => x.order = k);
}
function dropTo(id, col, beforeId){
  moveTo(id, col);
  if(col === 'today') reorderToday(id, beforeId);
  UI.sel = id; commit();
}
function action(act, id){
  const t = taskById(id); if(!t) return;
  switch(act){
    case 'tmr': moveTo(id,'tomorrow'); break;
    case 'fri': moveTo(id,'week'); break;
    case 'wait': moveTo(id,'waiting'); break;
    case 'sun': { const w = t.waiting; moveTo(id,'today'); if(w) t.type = 'reclamar'; break; }
    case 'rot': t.type = TYPES[(TYPES.indexOf(t.type)+1)%3]; break;
    case 'done': return doDone(id);
  }
  commit();
}
function createFromLine(text){
  const p = parseLine(text), r = resolve(p);
  if(r.bad.length){ toast('No existe: ' + r.bad.join(' ') + ' · elígelo en el desplegable'); return false; }
  if(!p.title){ toast('Falta el título'); return false; }
  const t = Object.assign({id:uid('t'),title:p.title,personId:'me',projectId:null,type:'hacer',date:defaultDate(),waiting:false,remindOn:null,
    note:'',order:maxOrder()+1,done:false,doneAt:null,createdAt:new Date().toISOString()}, r.patch);
  S.tasks.push(t); commit();
  toast(`Creada · ${COLNAME[colOf(t,today())]}`);
  return true;
}
function addPerson(name){
  const n = S.people.filter(p => p.id !== 'me').length;
  const p = {id:uid('u'), name:name.trim(), color:PAL_NAMES[n % PAL_NAMES.length]};
  S.people.push(p); save(); return p;
}
function addProject(name, programId){
  const p = {id:uid('pr'), programId, name:name.trim(), fav:false};
  S.projects.push(p); save(); return p;
}

/* ======================= POPOVER ======================= */
const popEl = document.getElementById('pop');
function closePop(){ popEl.style.display = 'none'; popEl._pick = null; }
function openPop(anchor, html, onPick){
  popEl.innerHTML = html; popEl.style.display = 'block'; popEl._pick = onPick; popEl._anchor = anchor;
  const r = anchor.getBoundingClientRect(), w = popEl.offsetWidth, h = popEl.offsetHeight;
  popEl.style.left = Math.max(8, Math.min(r.left, innerWidth-w-8)) + 'px';
  popEl.style.top = (r.bottom + 4 + h > innerHeight ? Math.max(8, r.top-h-4) : r.bottom+4) + 'px';
}
function popPerson(anchor, id){
  const html = S.people.map(p => `<button class="it" data-v="${p.id}">${esc(p.name)}</button>`).join('');
  openPop(anchor, html, v => { taskById(id).personId = v; commit(); });
}
function popProject(anchor, id){
  let html = `<button class="it" data-v="">— sin proyecto —</button>`;
  S.programs.forEach(pg => {
    const prs = S.projects.filter(p => p.programId === pg.id);
    if(prs.length) html += `<div class="gh">${esc(pg.name)}</div>` + prs.map(p => `<button class="it" data-v="${p.id}">${p.fav ? '★ ' : ''}${esc(p.name)}</button>`).join('');
  });
  openPop(anchor, html, v => { taskById(id).projectId = v || null; commit(); });
}
function popDate(anchor, id){
  const t = taskById(id);
  const html = `<div class="qd"><button data-v="hoy">hoy</button><button data-v="man">mañ</button><button data-v="vie">vie</button><button data-v="lun">lun</button></div>
    <input type="date" value="${t.date}" aria-label="Fecha">`;
  openPop(anchor, html, v => {
    const td = today(); let d = v;
    if(v === 'hoy') d = td; else if(v === 'man') d = addDays(td,1);
    else if(v === 'vie') d = addDays(td,(4-dow(td)+7)%7); else if(v === 'lun') d = addDays(td,(7-dow(td))%7);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    Object.assign(t,{date:d,waiting:false,remindOn:null}); commit();
  });
}

/* ======================= EDICIÓN EN SITIO ======================= */
let ED = null;
function startEdit(id, el){
  if(ED) return;
  const t = taskById(id); if(!t) return;
  const inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'inline-edit'; inp.value = t.title; inp.setAttribute('aria-label','Editar título');
  el.replaceWith(inp);
  ED = {id, inp, done:false};
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  attachAC(inp);
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); finishEdit(true); }
    else if(e.key === 'Escape'){ e.preventDefault(); finishEdit(false); }
  });
  inp.addEventListener('blur', () => setTimeout(() => { if(ED && ED.inp === inp && acClosed()) finishEdit(true); }, 120));
}
function finishEdit(apply){
  if(!ED || ED.done) return;
  const {id, inp} = ED;
  if(apply){
    const t = taskById(id), p = parseLine(inp.value), r = resolve(p);
    if(r.bad.length){ toast('No existe: ' + r.bad.join(' ')); return; }
    if(!p.title){ toast('Falta el título'); return; }
    t.title = p.title; Object.assign(t, r.patch);
  }
  ED.done = true; ED = null; acClose();
  apply ? commit() : render();
}

/* ======================= AUTOCOMPLETE @ # ======================= */
const acEl = document.getElementById('ac');
const AC = {inp:null,kind:'',q:'',start:0,end:0,items:[],idx:0,stage:'',pendingName:''};
const acClosed = () => acEl.style.display === 'none';
function acClose(){ acEl.style.display = 'none'; AC.items = []; }
function acDraw(){
  const r = AC.inp.getBoundingClientRect();
  let h = AC.stage === 'program' ? `<div class="gh">Programa de «${esc(AC.pendingName)}»</div>` : '';
  h += AC.items.map((it,i) => {
    let label, cls = '';
    if(it.t === 'new'){ label = `Crear ${AC.kind === 'person' ? 'persona' : 'proyecto'}: ${esc(AC.q.replace(/_/g,' '))}`; cls = ' new'; }
    else if(it.t === 'prg') label = esc(it.x.name);
    else if(AC.kind === 'project'){ const pg = S.programs.find(g => g.id === it.x.programId); label = `${esc(it.x.name)} <span class="count">${esc(pg ? pg.name : '')}</span>`; }
    else label = esc(it.x.name);
    return `<button class="${i === AC.idx ? 'on' : ''}${cls}" data-i="${i}" tabindex="-1">${label}</button>`;
  }).join('');
  acEl.innerHTML = h; acEl.style.display = 'block';
  acEl.style.left = Math.min(r.left, innerWidth-acEl.offsetWidth-8) + 'px';
  acEl.style.top = (r.bottom + 4) + 'px';
}
function acUpdate(inp){
  const c = inp.selectionStart, m = /(^|\s)([@#])([^\s]*)$/.exec(inp.value.slice(0,c));
  if(!m){ acClose(); return; }
  const kind = m[2] === '@' ? 'person' : 'project', q = m[3], nq = norm(q.replace(/_/g,' '));
  const list = kind === 'person' ? S.people : S.projects;
  const items = list.filter(x => norm(x.name).includes(nq))
    .sort((a,b) => norm(b.name).startsWith(nq) - norm(a.name).startsWith(nq)).map(x => ({t:'pick',x}));
  if(q && !list.some(x => norm(x.name) === nq)) items.push({t:'new'});
  if(!items.length){ acClose(); return; }
  Object.assign(AC,{inp,kind,q,start:c-q.length-1,end:c,items,idx:0,stage:'list'});
  acDraw();
}
function acInsert(name){
  const inp = AC.inp, rep = (AC.kind === 'person' ? '@' : '#') + name.replace(/\s+/g,'_') + ' ';
  inp.value = inp.value.slice(0,AC.start) + rep + inp.value.slice(AC.end);
  const pos = AC.start + rep.length; acClose(); inp.focus(); inp.setSelectionRange(pos,pos);
}
function acPick(i){
  const it = AC.items[i]; if(!it) return;
  if(AC.stage === 'program'){ acInsert(addProject(AC.pendingName, it.x.id).name); return; }
  if(it.t === 'pick') return acInsert(it.x.name);
  const name = AC.q.replace(/_/g,' ');
  if(AC.kind === 'person') return acInsert(addPerson(name).name);
  AC.stage = 'program'; AC.pendingName = name; AC.idx = 0;
  AC.items = S.programs.map(x => ({t:'prg',x})); acDraw();
}
function attachAC(inp){
  inp.addEventListener('input', () => acUpdate(inp));
  inp.addEventListener('click', () => acUpdate(inp));
  inp.addEventListener('keydown', e => {
    if(acClosed() || AC.inp !== inp) return;
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); e.stopImmediatePropagation();
      AC.idx = (AC.idx + (e.key === 'ArrowDown' ? 1 : -1) + AC.items.length) % AC.items.length; acDraw();
    }else if(e.key === 'Escape'){
      e.preventDefault(); e.stopImmediatePropagation(); acClose();
    }else if(e.key === 'Tab' || e.key === 'Enter'){
      if(e.key === 'Enter' && AC.stage === 'list' && AC.items[0].t === 'pick' && norm(AC.items[0].x.name) === norm(AC.q.replace(/_/g,' '))){ acClose(); return; }
      e.preventDefault(); e.stopImmediatePropagation(); acPick(AC.idx);
    }
  }, true);
  inp.addEventListener('blur', () => setTimeout(() => { if(document.activeElement !== inp) acClose(); }, 100));
}
acEl.addEventListener('mousedown', e => e.preventDefault());
acEl.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if(b) acPick(+b.dataset.i); });

    <label>Nota<textarea data-f="note">${esc(t.note)}</textarea></label>
    <div class="frow"><button class="btn" data-p="done">✓ Hecha</button><span class="sp"></span><button class="btn danger" data-p="del">Borrar</button></div>`;
  panelEl.style.display = 'flex';
}
panelEl.addEventListener('input', e => {
  const f = e.target.dataset.f, t = taskById(UI.panel); if(!t) return;
  if(f === 'title'){ if(e.target.value.trim()) t.title = e.target.value; save(); }
  else if(f === 'note'){ t.note = e.target.value; save(); }
});
panelEl.addEventListener('change', e => {
  const f = e.target.dataset.f, t = taskById(UI.panel); if(!f || !t) return;
  const v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if(f === 'projectId') t.projectId = v || null;
  else if(f === 'waiting'){ t.waiting = v; t.remindOn = v ? addDays(today(), S.settings.waitDays) : null; }
  else if(f === 'date'){ if(!v) return; t.date = v; }
  else if(f === 'remindOn'){ if(!v) return; t.remindOn = v; }
  else if(f === 'title'){ if(!v.trim()){ e.target.value = t.title; return; } t.title = v; }
  else t[f] = v;
  commit(); if(f === 'waiting') openPanel(t.id);
});
panelEl.addEventListener('click', e => {
  const b = e.target.closest('[data-p]'); if(!b) return;
  const id = UI.panel;
  if(b.dataset.p === 'close') closePanel();
  else if(b.dataset.p === 'done'){ closePanel(); doDone(id); }
  else if(b.dataset.p === 'del' && confirm('¿Borrar esta tarea?')){
    closePanel(); S.tasks = S.tasks.filter(t => t.id !== id); UI.sel = null; commit();
  }
});

/* ======================= MODALES ======================= */
const modalBg = document.getElementById('modalbg'), modalEl = document.getElementById('modal');
function showModal(html){ modalEl.innerHTML = html; modalBg.style.display = 'flex'; }
function closeModal(){ modalBg.style.display = 'none'; modalEl.innerHTML = ''; UI.modal = null; }
const closeBtn = '<button class="btn" data-m="close" style="margin-left:auto" aria-label="Cerrar">✕</button>';
function openDone(){
  UI.modal = 'done';
  const list = S.tasks.filter(t => t.done).sort((a,b) => (b.doneAt||'').localeCompare(a.doneAt||''));
  showModal(`<h2>Hechas (${list.length})${closeBtn}</h2>` + (list.length ? list.map(t => {
    const d = t.doneAt ? new Date(t.doneAt) : null;
    return `<div class="donerow"><span class="d">${d ? `${dm(iso(d))}/${String(d.getFullYear()).slice(2)} ${d.toTimeString().slice(0,5)}` : ''}</span><span class="t">${esc(t.title)}</span><button class="btn" data-m="undo" data-id="${t.id}">Recuperar</button></div>`;
  }).join('') : '<div class="empty">Ninguna todavía.</div>'));
}
function openKeys(){
  UI.modal = 'keys';
  const rows = [['N','Enfocar línea rápida'],['/','Buscar'],['?','Esta tabla'],['↑ ↓','Seleccionar fila'],['H','Mover a Hoy'],['M','Mañana'],['S','Esta semana (viernes)'],['P','Próxima semana (lunes)'],['L','Más adelante (+30 días)'],['E','Esperando'],['X / Supr','Hecha'],['Intro','Abrir panel de edición'],['Esc','Deseleccionar / cerrar']];
  showModal(`<h2>Atajos${closeBtn}</h2><table class="keys">${rows.map(r => `<tr><td><kbd>${r[0]}</kbd></td><td>${r[1]}</td></tr>`).join('')}</table>`);
}
function openSettings(){
  UI.modal = 'settings';
  const prev = modalEl.scrollTop, s = S.settings;
  const sel = (key, arr) => `<select data-s="${key}">${arr.map(([v,l]) => `<option value="${v}"${String(s[key]) === String(v) ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
  const cnt = id => S.tasks.filter(t => t.personId === id).length;
  const people = S.people.map(p => {
    const me = p.id === 'me', c = cnt(p.id), st = me ? '' : `style="background:${(PAL[p.color]||PAL.slate)[0]};color:${(PAL[p.color]||PAL.slate)[1]}"`;
    return `<div class="frow"><span class="chip${me ? ' me' : ''}" ${st}>${esc(p.name)}</span>
      <input type="text" data-pn="${p.id}" value="${esc(p.name)}"${me ? ' disabled' : ''} aria-label="Nombre">
      <select data-pc="${p.id}"${me ? ' disabled' : ''} aria-label="Color">${me ? '<option>black</option>' : PAL_NAMES.map(n => `<option${n === p.color ? ' selected' : ''}>${n}</option>`).join('')}</select>
      <span class="count">${c} tareas</span>
      <button class="btn" data-m="pdel" data-id="${p.id}"${me || c ? ' disabled' : ''} aria-label="Borrar persona">Borrar</button></div>`;
  }).join('');
  const prgs = S.programs.map(pg => {
    const prs = S.projects.filter(p => p.programId === pg.id);
    return `<div class="grp"><div class="frow"><input type="text" data-gn="${pg.id}" value="${esc(pg.name)}" aria-label="Programa">
      <button class="btn" data-m="gdel" data-id="${pg.id}"${prs.length || S.programs.length < 2 ? ' disabled' : ''}>Borrar programa</button></div>
      ${prs.map(p => `<div class="frow sub"><button class="btn" data-m="fav" data-id="${p.id}" aria-label="Favorito">${p.fav ? '★' : '☆'}</button>
        <input type="text" data-jn="${p.id}" value="${esc(p.name)}" aria-label="Proyecto">
        <select data-jp="${p.id}" aria-label="Programa">${S.programs.map(g => `<option value="${g.id}"${g.id === p.programId ? ' selected' : ''}>${esc(g.name)}</option>`).join('')}</select>
        <button class="btn" data-m="jdel" data-id="${p.id}"${S.tasks.some(t => t.projectId === p.id) ? ' disabled' : ''}>Borrar</button></div>`).join('')}
      <div class="frow sub"><input type="text" data-ja="${pg.id}" placeholder="Nuevo proyecto en ${esc(pg.name)}"><button class="btn" data-m="jadd" data-id="${pg.id}">Añadir</button></div></div>`;
  }).join('');
  const old = S.tasks.filter(t => t.done && t.doneAt && diffDays(today(), iso(new Date(t.doneAt))) > 90).length;
  const fileSt = fh ? `Vinculado: <b>${esc(fh.name)}</b>` : (hasFS() ? 'Sin archivo vinculado' : 'Este navegador no permite vincular archivos; usa Exportar/Importar.');
  showModal(`<h2>Ajustes${closeBtn}</h2>
    <div class="frow"><label>Capturar en</label>${sel('captureIn',[['today','Hoy'],['tomorrow','Mañana'],['week','Viernes de esta semana'],['nextweek','Próxima semana']])}</div>
    <div class="frow"><label>Alerta de espera (días)</label><input type="number" min="1" max="60" data-s="waitDays" value="${s.waitDays}" style="width:80px"></div>
    <div class="frow"><label>Aviso en Hoy a partir de</label><input type="number" min="1" max="99" data-s="warnToday" value="${s.warnToday}" style="width:80px"></div>
    <div class="frow"><label>Tema</label>${sel('theme',[['light','Claro'],['dark','Oscuro']])}</div>
    <h3>Personas</h3>${people}
    <div class="frow"><input type="text" id="newPerson" placeholder="Nueva persona"><button class="btn" data-m="padd">Añadir</button></div>
    <h3>Programas y proyectos</h3>${prgs}
    <div class="frow"><input type="text" id="newProg" placeholder="Nuevo programa"><button class="btn" data-m="gadd">Añadir</button></div>
    <h3>Archivo vinculado</h3>
    <div class="frow"><span>${fileSt}</span></div>
    ${hasFS() ? `<div class="frow"><button class="btn" data-m="fopen">Abrir tareas.json existente…</button><button class="btn" data-m="fnew">Crear archivo nuevo…</button>${fh ? '<button class="btn" data-m="funlink">Desvincular</button>' : ''}</div>` : ''}
    <h3>Respaldo</h3>
    <div class="frow"><button class="btn" data-m="export">Exportar JSON</button><button class="btn" data-m="import">Importar JSON…</button><input type="file" id="impFile" accept=".json,application/json" hidden></div>
    <h3>Mantenimiento</h3>
    <div class="frow"><button class="btn" data-m="purge"${old ? '' : ' disabled'}>Purgar hechas de más de 90 días (${old})</button></div>`);
  modalEl.scrollTop = prev;
}
modalBg.addEventListener('mousedown', e => { if(e.target === modalBg) closeModal(); });
modalEl.addEventListener('change', e => {
  const d = e.target.dataset, v = e.target.value;
  if(d.s){
    S.settings[d.s] = (d.s === 'waitDays' || d.s === 'warnToday') ? Math.max(1, parseInt(v) || 1) : v;
    commit(); if(d.s === 'theme') openSettings(); return;
  }
  const nm = v.trim();
  if(d.pn){ if(nm){ S.people.find(p => p.id === d.pn).name = nm; commit(); } }
  else if(d.pc){ S.people.find(p => p.id === d.pc).color = v; commit(); openSettings(); }
  else if(d.gn){ if(nm){ S.programs.find(p => p.id === d.gn).name = nm; commit(); } }
  else if(d.jn){ if(nm){ S.projects.find(p => p.id === d.jn).name = nm; commit(); } }
  else if(d.jp){ S.projects.find(p => p.id === d.jp).programId = v; commit(); openSettings(); }
  else if(e.target.id === 'impFile' && e.target.files[0]) importJson(e.target.files[0]);
});
modalEl.addEventListener('click', e => {
  const b = e.target.closest('[data-m]'); if(!b) return;
  const m = b.dataset.m, id = b.dataset.id, val = sel => (modalEl.querySelector(sel) || {}).value?.trim();
  switch(m){
    case 'close': closeModal(); break;
    case 'undo': setDone(id,false); commit(); openDone(); break;
    case 'pdel': S.people = S.people.filter(p => p.id !== id); commit(); openSettings(); break;
    case 'padd': { const n = val('#newPerson'); if(n){ addPerson(n); commit(); openSettings(); } break; }
    case 'gadd': { const n = val('#newProg'); if(n){ S.programs.push({id:uid('p'),name:n}); commit(); openSettings(); } break; }
    case 'gdel': S.programs = S.programs.filter(p => p.id !== id); if(UI.filter.programId === id) UI.filter.programId = UI.filter.projectId = null; commit(); openSettings(); break;
    case 'jadd': { const n = val(`[data-ja="${id}"]`); if(n){ addProject(n,id); commit(); openSettings(); } break; }
    case 'jdel': S.projects = S.projects.filter(p => p.id !== id); if(UI.filter.projectId === id) UI.filter.projectId = null; commit(); openSettings(); break;
    case 'fav': { const p = S.projects.find(x => x.id === id); p.fav = !p.fav; commit(); openSettings(); break; }
    case 'fopen': linkFile('open'); break;
    case 'fnew': linkFile('new'); break;
    case 'funlink': unlinkFile(); break;
    case 'export': exportJson(); break;
    case 'import': document.getElementById('impFile').click(); break;
    case 'purge':
      if(confirm('¿Borrar definitivamente las hechas de más de 90 días?')){
        S.tasks = S.tasks.filter(t => !(t.done && t.doneAt && diffDays(today(), iso(new Date(t.doneAt))) > 90));
        commit(); openSettings();
      }
      break;
  }
});

/* ======================= EVENTOS ======================= */
const board = document.getElementById('board');
const quick = document.getElementById('q'), search = document.getElementById('search');
attachAC(quick);
quick.addEventListener('keydown', e => {
  if(e.defaultPrevented) return;
  if(e.key === 'Enter'){ e.preventDefault(); if(quick.value.trim() && createFromLine(quick.value)){ quick.value = ''; acClose(); } }
  else if(e.key === 'Escape') quick.blur();
});
search.addEventListener('input', () => { UI.filter.q = search.value.trim(); render(); });
search.addEventListener('keydown', e => { if(e.key === 'Escape'){ search.value = ''; UI.filter.q = ''; render(); search.blur(); } });
document.getElementById('btnDone').addEventListener('click', openDone);
document.getElementById('btnSet').addEventListener('click', openSettings);
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if(!b) return;
  const f = UI.filter, k = b.dataset.f;
  if(k === 'all'){ f.kind = 'all'; f.programId = f.projectId = null; }
  else if(k === 'mine' || k === 'claim') f.kind = f.kind === k ? 'all' : k;
  else if(k === 'prg'){ f.programId = f.programId === b.dataset.id ? null : b.dataset.id; f.projectId = null; }
  else if(k === 'prj') f.projectId = f.projectId === b.dataset.id ? null : b.dataset.id;
  render();
});
document.getElementById('foot').addEventListener('click', e => { if(e.target.closest('[data-act="perm"]')) askPerm(); });

document.addEventListener('mousedown', e => {
  if(popEl.style.display === 'block' && !popEl.contains(e.target)) closePop();
});
popEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-v]'); if(b && popEl._pick){ const f = popEl._pick; closePop(); f(b.dataset.v); }
});
popEl.addEventListener('change', e => { if(e.target.type === 'date' && popEl._pick && e.target.value){ const f = popEl._pick; closePop(); f(e.target.value); } });

board.addEventListener('click', e => {
  const row = e.target.closest('[data-id]'); if(!row) return;
  const id = row.dataset.id, a = e.target.closest('[data-act]');
  if(ED && ED.inp.contains(e.target)) return;
  const wasSel = UI.sel === id;
  if(!a){ if(!wasSel){ UI.sel = id; render(); } return; }
  const act = a.dataset.act;
  if(act === 'edit'){ UI.sel = id; if(!wasSel) render(); startEdit(id, document.querySelector(`[data-id="${id}"] .title`)); return; }
  UI.sel = id;
  if(act === 'person'){ render(); popPerson(document.querySelector(`[data-id="${id}"] [data-act="person"]`), id); }
  else if(act === 'proj'){ render(); popProject(document.querySelector(`[data-id="${id}"] [data-act="proj"]`), id); }
  else if(act === 'date'){ render(); popDate(document.querySelector(`[data-id="${id}"] [data-act="date"]`), id); }
  else action(act, id);
});
board.addEventListener('dblclick', e => {
  const row = e.target.closest('[data-id]');
  if(!row || e.target.closest('.dot,.chip,.dtxt,.c-btns,.hb')) return;
  if(ED){ ED.done = true; ED = null; acClose(); }
  UI.sel = row.dataset.id; render(); openPanel(row.dataset.id);
});
/* arrastre */
function clearMarks(){ board.querySelectorAll('.mark-before,.mark-after,.over').forEach(x => x.classList.remove('mark-before','mark-after','over')); }
board.addEventListener('dragstart', e => {
  const r = e.target.closest && e.target.closest('[data-id]'); if(!r) return;
  UI.drag = r.dataset.id; e.dataTransfer.setData('text/plain', UI.drag); e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => r.classList.add('dragging'), 0);
});
board.addEventListener('dragend', () => { UI.drag = null; clearMarks(); board.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); });
board.addEventListener('dragover', e => {
  const z = e.target.closest('[data-drop]'); if(!UI.drag || !z) return;
  e.preventDefault(); clearMarks(); z.classList.add('over');
  const card = e.target.closest('.card');
  if(z.dataset.drop === 'today' && card && card.dataset.id !== UI.drag){
    const r = card.getBoundingClientRect();
    card.classList.add(e.clientY < r.top + r.height/2 ? 'mark-before' : 'mark-after');
  }
});
board.addEventListener('drop', e => {
  const z = e.target.closest('[data-drop]'); if(!UI.drag || !z) return;
  e.preventDefault();
  const id = UI.drag; let before = null;
  const card = e.target.closest('.card');
  if(z.dataset.drop === 'today' && card && card.dataset.id !== id){
    const r = card.getBoundingClientRect();
    if(e.clientY < r.top + r.height/2) before = card.dataset.id;
    else { let n = card.nextElementSibling; if(n && n.dataset.id === id) n = n.nextElementSibling; before = n ? n.dataset.id : null; }
  }
  UI.drag = null; clearMarks();
  dropTo(id, z.dataset.drop, before);
});

/* teclado */
document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, tg = e.target;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName) || tg.isContentEditable;
  if(k === 'Escape'){
    if(!acClosed()){ acClose(); return; }
    if(popEl.style.display === 'block'){ closePop(); return; }
    if(UI.modal){ closeModal(); return; }
    if(UI.panel){ closePanel(); return; }
    if(typing){ tg.blur(); return; }
    if(UI.sel){ UI.sel = null; render(); }
    return;
  }
  if(typing || UI.modal) return;
  const lk = k.toLowerCase();
  if(lk === 'n'){ e.preventDefault(); quick.focus(); return; }
  if(k === '/'){ e.preventDefault(); search.focus(); return; }
  if(k === '?'){ e.preventDefault(); openKeys(); return; }
  if(tg.tagName === 'BUTTON' && (k === 'Enter' || k === ' ')) return;
  if(k === 'ArrowDown' || k === 'ArrowUp'){
    if(!UI.order.length) return;
    e.preventDefault();
    const i = UI.order.indexOf(UI.sel);
    UI.sel = UI.order[i < 0 ? 0 : Math.max(0, Math.min(UI.order.length-1, i + (k === 'ArrowDown' ? 1 : -1)))];
    render(); return;
  }
  const id = UI.sel; if(!id || !taskById(id)) return;
  const map = {h:'today',m:'tomorrow',s:'week',p:'next',l:'later',e:'waiting'};
  if(map[lk]){ e.preventDefault(); moveTo(id, map[lk]); commit(); }
  else if(lk === 'x' || k === 'Delete'){ e.preventDefault(); doDone(id); }
  else if(k === 'Enter'){ e.preventDefault(); openPanel(id); }
});

/* cambio de día */
let lastDay = today();
function tick(){ if(today() !== lastDay){ lastDay = today(); if(!ED) render(); } }
setInterval(tick, 60000);
window.addEventListener('focus', tick);

init();
</script>
</body>
